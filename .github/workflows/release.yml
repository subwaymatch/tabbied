name: Release

on:
  # Every merge to main: open or refresh the "Version Packages" PR, and publish
  # when that PR is what just landed. Merge it whenever you want to ship early.
  push:
    branches: [main]
  # Otherwise main ships itself once a week: if anything is waiting, this
  # versions and publishes it without a human merging the version PR.
  # Mondays, 17:23 UTC (a few minutes off the hour - GitHub delays crons
  # scheduled on it).
  schedule:
    - cron: '23 17 * * 1'
  # The same path as the weekly run, on demand.
  workflow_dispatch:
    inputs:
      auto_patch:
        description: 'Bump patch when the package changed but nobody wrote a changeset'
        type: boolean
        default: true

# Never run two releases concurrently against the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the version commit / PR branch, create git tags + GitHub Releases
  pull-requests: write # open/update the "Version Packages" PR
  id-token: write # npm Trusted Publishing (OIDC) + provenance attestations

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Changesets needs full history to detect changes
          fetch-tags: true # the weekly run reads the last release tag

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # OIDC trusted publishing requires a recent npm; runners don't always
      # ship one new enough. (Pin to a specific version if you prefer.)
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # `changeset publish` ships every publishable workspace, so every one of
      # them has to be built first. Only `tabbied` has a `prepublishOnly`, and
      # the other two deliberately don't: changesets publishes packages
      # concurrently, so a build at publish time would race `tabbied`'s own
      # `rm -rf dist` - which `tabbied-mcp` compiles against. Build here, once,
      # in dependency order, and let publish be publish.
      - name: Build the packages
        run: npm run build:packages

      # Scheduled/manual runs decide for themselves what (if anything) to ship.
      # Push runs skip this and hand straight to changesets/action, which knows
      # whether to open the version PR or publish.
      - name: Decide what to release
        id: plan
        if: github.event_name != 'push'
        env:
          # workflow_dispatch sends a string; schedule sends nothing at all.
          AUTO_PATCH: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.auto_patch }}
        run: |
          set -euo pipefail

          # `changeset publish` is workspace-wide, so every question below is
          # asked per package rather than about `tabbied` alone. One
          # "<name> <version> <dir>" line per publishable workspace.
          packages=$(node -e '
            const fs = require("node:fs");
            for (const dir of fs.readdirSync("packages")) {
              const file = `packages/${dir}/package.json`;
              if (!fs.existsSync(file)) continue;
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              if (pkg.private) continue;
              console.log([pkg.name, pkg.version, `packages/${dir}`].join(" "));
            }
          ')

          # .changeset/README.md is documentation, not a pending changeset.
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          echo "pending changesets: $pending"

          ahead_of_npm=''
          while read -r name version dir; do
            [ -n "$name" ] || continue
            published=$(npm view "$name" version 2>/dev/null || echo '')
            echo "$name: local $version, npm ${published:-<none>}"

            if [ -z "$published" ]; then
              # Trusted publishing cannot create a name that isn't on npm yet:
              # the trusted publisher is configured on the package's settings
              # page, which doesn't exist until something has been published.
              # See "Bootstrapping a new package" in RELEASING.md.
              echo "::warning::$name has never been published, and OIDC cannot create it. Publish $name@$version by hand once, then add its trusted publisher."
            elif [ "$version" != "$published" ]; then
              ahead_of_npm="$ahead_of_npm $name"
            fi
          done <<< "$packages"

          if [ "$pending" -gt 0 ]; then
            echo 'mode=version' >> "$GITHUB_OUTPUT"
            echo "-> version + publish ($pending changeset(s) waiting)"
            exit 0
          fi

          # A version commit that landed but never published (a failed publish,
          # or a version PR merged while the schedule was idle) still needs
          # shipping - `changeset publish` is a no-op when it doesn't.
          if [ -n "$ahead_of_npm" ]; then
            echo 'mode=publish' >> "$GITHUB_OUTPUT"
            echo "-> publish (not on npm yet:$ahead_of_npm)"
            exit 0
          fi

          if [ "$AUTO_PATCH" != 'true' ]; then
            echo 'mode=skip' >> "$GITHUB_OUTPUT"
            echo '-> nothing to do (auto-patch off)'
            exit 0
          fi

          # Nothing declared a bump, so fall back to "did this package change at
          # all since its own last release?" and cut a patch for each one that
          # did. Anything bigger than a patch should carry its own changeset.
          # `tabbied@*` doesn't glob onto `tabbied-mcp@0.2.0`, so each package
          # reads only its own tags.
          bumped=''
          while read -r name version dir; do
            [ -n "$name" ] || continue
            last_tag=$(git describe --tags --match "$name@*" --abbrev=0 2>/dev/null || true)

            if [ -z "$last_tag" ]; then
              echo "$name: no $name@* tag to diff against yet"
              continue
            fi

            if git diff --quiet "$last_tag"..HEAD -- "$dir"; then
              echo "$name: no changes since $last_tag"
              continue
            fi

            {
              echo '---'
              echo "'$name': patch"
              echo '---'
              echo
              echo "Changes since ${last_tag} that landed without a changeset:"
              echo
              git log --format='- %s' "$last_tag"..HEAD -- "$dir"
            } > ".changeset/auto-weekly-${name//[^a-zA-Z0-9._-]/-}.md"

            bumped="$bumped $name"
            echo "$name: auto patch (changed since $last_tag)"
          done <<< "$packages"

          if [ -z "$bumped" ]; then
            echo 'mode=skip' >> "$GITHUB_OUTPUT"
            echo '-> nothing to do (no package changes since the last release tags)'
            exit 0
          fi

          echo 'mode=version' >> "$GITHUB_OUTPUT"
          echo "-> version + publish (auto patch:$bumped)"

      # The weekly release does its own versioning and lands it on main, so it
      # can publish in this same run. Pushing with GITHUB_TOKEN deliberately
      # does not retrigger this workflow, so there is no second release.
      - name: Version and commit to main
        if: steps.plan.outputs.mode == 'version'
        env:
          # @changesets/changelog-github calls the API to credit PRs/authors.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run version-packages
          git add -A
          git commit -m 'chore(release): version packages'
          git push origin HEAD:main

      # Push runs: opens/updates the "Version Packages" PR when changesets are
      # pending, publishes when that PR is what just merged.
      # Scheduled/manual runs: there are no changesets left by now, so this is
      # the publish (npm + git tag + GitHub Release).
      - name: Create release PR or publish to npm
        if: >-
          github.event_name == 'push' ||
          steps.plan.outputs.mode == 'version' ||
          steps.plan.outputs.mode == 'publish'
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: auth + provenance come from OIDC trusted publishing.
          # See RELEASING.md for the one-time npmjs.com configuration.

      # The weekly release consumed the changesets the open "Version Packages"
      # PR was built from, so that PR now describes a release that already
      # shipped. Deleting its branch closes it; the next merge to main carrying
      # a changeset opens a fresh one.
      - name: Retire the superseded version PR
        if: steps.plan.outputs.mode == 'version'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/git/refs/heads/changeset-release/main" \
            --silent || echo 'No version PR branch to retire.'
