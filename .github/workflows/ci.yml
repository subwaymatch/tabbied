name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package typecheck, build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Plain punctuation, everywhere: see "Plain punctuation" in CLAUDE.md.
      - name: Check typography
        run: npm run check:typography
      - name: Typecheck tabbied
        run: npm run typecheck --workspace tabbied
      # tabbied-mcp imports tabbied/catalog.json, so tabbied has to be built
      # first; build:packages does both in order.
      - name: Build packages
        run: npm run build:packages
      - name: Test tabbied
        run: npm test --workspace tabbied
      # The protocol is the MCP SDK's, so this suite pins the seam instead: that
      # our tools register with schemas the SDK accepts, and that both protocol
      # eras see the same toolset (see docs/mcp-server.md).
      - name: Test tabbied-mcp
        run: npm test --workspace tabbied-mcp

  worker:
    name: Worker typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # worker/ is excluded from the site's tsconfig (it targets workerd, not
      # the browser), so nothing else would ever typecheck it.
      - name: Build packages
        run: npm run build:packages
      - name: Typecheck worker
        run: npm run typecheck:worker

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # `npm run build` builds the tabbied package (prebuild) then the static
      # site into out/, which `npm start` (the Playwright webServer) serves.
      - name: Build site (static export)
        run: npm run build
      # The Worker suite reads the packaged templates through the assets
      # binding, so it needs out/ and runs after the build, never during one
      # (next build empties out/ first). It was not run anywhere before this
      # step existed, so a route could ship with a branch no test had run.
      - name: Test worker
        run: npm run test:worker
      - name: Run e2e tests
        run: npm run test:e2e
      - name: Upload Playwright traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
